[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-redkit"
version = "1.0.0"
description = "Automated red-team harness for LLM applications"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.7",
    "jinja2>=3.1",
    "pydantic>=2.6",
]

[project.scripts]
redkit = "llm_redkit.cli:main"

[tool.setuptools]
packages = ["llm_redkit"]
